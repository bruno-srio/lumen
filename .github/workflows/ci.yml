name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p yeelight -p yeelight-sim --all-targets -- -D warnings
      - name: Test
        run: cargo test -p yeelight -p yeelight-sim

  app:
    name: App tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev blueprint-compiler pkg-config xvfb
      - name: Test
        run: xvfb-run cargo test -p lumen

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      # The image stores its SDK on an overlay layer. Updating that SDK renames
      # directories across filesystems and fails with "Invalid cross-device link".
      # An anonymous volume copies the installation onto the runner's filesystem.
      options: --privileged -v /var/lib/flatpak
    steps:
      - uses: actions/checkout@v5
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: lumen-devel.flatpak
          manifest-path: build-aux/io.github.bruno_srio.Lumen.Devel.json
          cache-key: flatpak-gnome-51
      - uses: actions/upload-artifact@v6
        with:
          name: lumen-devel-flatpak
          path: lumen-devel.flatpak
