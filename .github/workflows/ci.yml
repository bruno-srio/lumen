name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p yeelight -p yeelight-sim --all-targets -- -D warnings
      - name: Test
        run: cargo test -p yeelight -p yeelight-sim
