[package]
name = "yeelight-sim"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Virtual Yeelight bulbs for development and tests"
rust-version = "1.85"

[dependencies]
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
yeelight = { path = "../yeelight" }
